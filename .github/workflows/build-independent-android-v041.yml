name: PGRP Independent Android Game Client 0.4.1

on:
  push:
    branches: [feature/pgrp-android-map-manifest-fix-v041]
    paths:
      - 'android-client/**'
      - '.github/workflows/build-independent-android-v041.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  independent-game-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout independent Android game code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use GitHub runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assert map preview sources are installed
        run: |
          grep -q 'openRealMapPreview()' android-client/app/src/main/java/ir/paladinguard/gameclient/GameActivity.java
          grep -q 'class GtaMapPlacementIndex' android-client/app/src/main/java/ir/paladinguard/gameclient/GtaMapPlacementIndex.java
          grep -q 'class GtaMapSafSource' android-client/app/src/main/java/ir/paladinguard/gameclient/GtaMapSafSource.java
          grep -q 'class GtaIplMapPreview' android-client/app/src/main/java/ir/paladinguard/gameclient/GtaIplMapPreview.java
          echo 'Map location preview wired to independent Android client'

      - name: Check specific GTA .ZON fatal parse fix
        shell: bash
        run: |
          grep -q 'normalizedSuffix.endsWith(required)' android-client/app/src/main/java/ir/paladinguard/gameclient/GtaMapPlacementIndex.java
          grep -q 'skipsRealGtaZoneMetadataWithoutAbortingIplMapScan' android-client/app/src/test/java/ir/paladinguard/gameclient/GtaMapPlacementIndexTest.java
          echo 'Regression tests installed'

      - name: Test independent movement and RakNet header, build game APK
        working-directory: android-client
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify PGRP independent APK
        run: |
          set -euo pipefail
          src="android-client/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$src"
          cp "$src" PGRP_Independent_Android_Client_v0.4.1_Alpha.apk
          unzip -l PGRP_Independent_Android_Client_v0.4.1_Alpha.apk | grep 'classes.dex'
          sha256sum PGRP_Independent_Android_Client_v0.4.1_Alpha.apk
          ls -lh PGRP_Independent_Android_Client_v0.4.1_Alpha.apk

      - name: Verify previous APK signing key for in-place upgrade
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          oldurl="https://github.com/Amini2027/PGRP-alpha-build/releases/download/v0.4.0-android-ipl-placement-preview/PGRP_Independent_Android_Client_v0.4.0_Alpha.apk"
          curl -fL --retry 2 --max-time 90 "$oldurl" -o /tmp/pgrp_android_v040.apk
          prev=$("$apksigner" verify --print-certs /tmp/pgrp_android_v040.apk | grep 'Signer #1 certificate SHA-256 digest:' | head -1 | awk '{print $NF}')
          next=$("$apksigner" verify --print-certs PGRP_Independent_Android_Client_v0.4.1_Alpha.apk | grep 'Signer #1 certificate SHA-256 digest:' | head -1 | awk '{print $NF}')
          echo "Old signer SHA256: $prev"
          echo "New signer SHA256: $next"
          {
            echo "PGRP v0.4.0 APK signer SHA256: $prev"
            echo "PGRP v0.4.1 APK signer SHA256: $next"
            if [[ "$prev" == "$next" ]]; then
              echo "RESULT: SIGNATURES MATCH - Android permits in-place install if versionCode rises."
            else
              echo "RESULT: SIGNATURES DIFFER - Android will reject in-place update (INSTALL_FAILED_UPDATE_INCOMPATIBLE)."
              echo "Old GitHub CI used a fresh autogenerated debug.keystore on each runner. The old private key is not in the repository."
              echo "Do NOT represent this APK as an in-place update. To avoid uninstalling, use PGRP_Android_v0.4.1_Install_Alongside_v0.4.apk (different app package)."
              echo "A future stable upgrade chain requires secure persistent signing credentials."
            fi
          } > signing-compatibility.txt

      - name: Build optional side-by-side test APK preserving installed v0.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android-client/app/build.gradle')
          source=path.read_text()
          before="applicationId 'ir.paladinguard.gameclient'"
          after="applicationId 'ir.paladinguard.gameclient.preview'"
          assert source.count(before)==1, "applicationId anchor not unique"
          path.write_text(source.replace(before,after))
          manifest=Path('android-client/app/src/main/AndroidManifest.xml')
          xml=manifest.read_text()
          assert xml.count('android:label="Paladin Guard RP Game"')==1, "Manifest label anchor missing"
          manifest.write_text(xml.replace('android:label="Paladin Guard RP Game"',
              'android:label="PGRP 0.4.1 Test"'))
          PY
          (cd android-client && gradle --no-daemon assembleDebug)
          cp android-client/app/build/outputs/apk/debug/app-debug.apk PGRP_Android_v0.4.1_Install_Alongside_v0.4.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify PGRP_Android_v0.4.1_Install_Alongside_v0.4.apk
          package=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging PGRP_Android_v0.4.1_Install_Alongside_v0.4.apk | head -1)
          echo "$package"
          if [[ "$package" != *"name='ir.paladinguard.gameclient.preview'"* ]]; then
            echo "::error::Side-by-side APK has wrong package identity"
            exit 1
          fi
          echo 'Side-by-side installation possible without uninstalling v0.4; this is NOT a real in-place upgrade.'
          ls -lh PGRP_Android_v0.4.1_Install_Alongside_v0.4.apk

      - name: Preserve independent client APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PGRP-Android-Map-Fix-v041
          path: |
            PGRP_Independent_Android_Client_v0.4.1_Alpha.apk
            signing-compatibility.txt
            PGRP_Android_v0.4.1_Install_Alongside_v0.4.apk
          if-no-files-found: error

      - name: Release alpha game-client APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v0.4.1-gta-map-manifest-fix"
          sha="$(sha256sum PGRP_Independent_Android_Client_v0.4.1_Alpha.apk | cut -d' ' -f1)"
          notes="PGRP Android v0.4.1 fixes the real v0.4 fatal GTA gta.dat parse error: IPL metadata such as DATA/MAP.ZON and DATA/INFO.ZON are skipped before validating only .IPL and .IDE filenames. VersionCode 5 and same applicationId. Existing local GTA asset indexing, touch demo, and in-app point placement preview preserved. WARNING: v0.4 was debug-signed with an ephemeral GitHub runner signing key. Without that same private key, Android DOES NOT allow an in-place update; see signing-compatibility.txt in this release. User-owned game files in Download/PGRP-GTA remain unaffected. This alpha still does not render real GTA DFF/TXD or connect as a player to open.mp. SHA256: $sha"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" PGRP_Independent_Android_Client_v0.4.1_Alpha.apk PGRP_Android_v0.4.1_Install_Alongside_v0.4.apk signing-compatibility.txt --clobber
          else
            gh release create "$tag" PGRP_Independent_Android_Client_v0.4.1_Alpha.apk PGRP_Android_v0.4.1_Install_Alongside_v0.4.apk signing-compatibility.txt --target feature/pgrp-android-map-manifest-fix-v041 --title 'PGRP Android v0.4.1 - GTA Manifest Zone Parsing Fix' --notes "$notes" --prerelease
          fi
