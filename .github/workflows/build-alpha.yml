name: Build PGRP OpenSAMP Alpha (Win32)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-alpha.yml
      - tools/apply-client-fixes.ps1
      - tools/apply-launch-tracing.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-upstream-alpha:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout PGRP build scripts
        uses: actions/checkout@v4

      - name: Clone public OpenSAMP source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/bssth/opensamp.git upstream
          if ($LASTEXITCODE -ne 0) { throw 'Source clone failed' }
          $commit = (git -C upstream rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read upstream commit' }
          "UPSTREAM_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Source revision: $commit"

      - name: Apply verified PGRP OpenSAMP display and UI compatibility patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\apply-client-fixes.ps1 -Root 'upstream'
          if (-not $?) { throw 'PGRP compatibility patch step failed' }
          & .\tools\apply-launch-tracing.ps1 -Root 'upstream'
          if (-not $?) { throw 'PGRP launch tracing patch step failed' }

      - name: Compile Win32 Release using Visual Studio 2022
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe unavailable' }
          $matches = @(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'MSBuild\**\Bin\MSBuild.exe')
          $msbuild = $matches | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $msbuild) { throw 'VS2022 C++ MSBuild not found' }
          Write-Host "MSBuild: $msbuild"
          & $msbuild 'upstream\opensamp.sln' '/p:Configuration=Release' '/p:Platform=Win32' '/m' '/v:minimal' '/fl' '/flp:logfile=msbuild.log;verbosity=normal'
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Verify and package open-source alpha outputs only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'PGRP_OpenSAMP_Alpha_Win32'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          foreach ($binary in @('opensamp.exe', 'Client.Native.dll')) {
            $path = Join-Path 'upstream\bin' $binary
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing binary: $path" }
            Copy-Item -LiteralPath $path -Destination $out
            Get-FileHash -LiteralPath (Join-Path $out $binary) -Algorithm SHA256 | Format-List
          }
          Copy-Item -LiteralPath 'upstream\LICENSE' -Destination (Join-Path $out 'LICENSE.txt')
          Copy-Item -LiteralPath 'upstream\THIRD-PARTY-NOTICES.md' -Destination $out
          @(
            'PGRP: OpenSAMP upstream engine compatibility ALPHA experiment',
            'Not the final PGRP launcher/client; gameplay remains UNVERIFIED.',
            'Upstream source: https://github.com/bssth/opensamp',
            "Upstream commit: $env:UPSTREAM_COMMIT",
            'Windows Win32 (x86) only. No GTA copyrighted assets included.',
            'GPLv3 / third-party notices supplied; upstream lists unresolved license provenance questions.',
            'Use a separate, legally obtained GTA San Andreas US 1.0 installation for testing.',
            'Place the EXE and DLL beside gta_sa.exe in that separate game folder.',
            'Start opensamp.exe. In-game: //connect 46.38.138.33 7777 Ali_McClellan',
            'Not signed; launcher uses DLL injection and may be flagged by antivirus.'
          ) | Set-Content -LiteralPath (Join-Path $out 'README.txt') -Encoding utf8
          git -C upstream archive --format=zip --output=../PGRP_OpenSAMP_Alpha_Win32/OpenSAMP_corresponding_source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Get-ChildItem $out -File | Select-Object Name,Length | Format-Table -AutoSize

      - name: Publish alpha build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PGRP-OpenSAMP-Alpha-Win32
          path: PGRP_OpenSAMP_Alpha_Win32/
          if-no-files-found: error
          retention-days: 7

      - name: Publish build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PGRP-alpha-build-error-log
          path: msbuild.log
          if-no-files-found: ignore
          retention-days: 7
