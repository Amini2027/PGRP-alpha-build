name: PGRP Android v0.4.4 Real DFF Mesh Preview

on:
  push:
    branches: [feature/pgrp-android-dff-real-mesh-v044]
    paths:
      - 'android-client/**'
      - '.github/workflows/build-android-stable-v044.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PGRP_KEYSTORE_B64: ${{ secrets.PGRP_ANDROID_KEYSTORE_B64 }}
      PGRP_STORE_PASS: ${{ secrets.PGRP_ANDROID_STORE_PASSWORD }}
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android platform SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check original GTA DFF reader and regression tests
        run: |
          grep -q 'class GtaBinaryIplIndex' android-client/app/src/main/java/ir/paladinguard/gameclient/GtaBinaryIplIndex.java
          grep -q 'scanBinaryIpl' android-client/app/src/main/java/ir/paladinguard/gameclient/GtaMapSafSource.java
          grep -q 'GtaBinaryIplIndexTest' android-client/app/src/test/java/ir/paladinguard/gameclient/GtaBinaryIplIndexTest.java
          grep -q 'versionCode 8' android-client/app/build.gradle
          grep -q 'class GtaDffArchive' android-client/app/src/main/java/ir/paladinguard/gameclient/GtaDffArchive.java
          grep -q 'class GtaDffMeshTest' android-client/app/src/test/java/ir/paladinguard/gameclient/GtaDffMeshTest.java
          grep -q 'GtaDffPreviewActivity' android-client/app/src/main/AndroidManifest.xml
          grep -q 'openRealDffPreview' android-client/app/src/main/java/ir/paladinguard/gameclient/GameActivity.java
          echo "GTA DFF mesh validation ready"

      - name: Compile, test and create unsigned release APK
        working-directory: android-client
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Save verified unsigned release for offline protected-key signing
        run: |
          set -euo pipefail
          apk="android-client/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          cp "$apk" PGRP_Android_v0.4.4_Unsigned_Release.apk
          echo "An unsigned APK is not installable as a stable release; the next signing step requires private credentials."

      - name: Upload unsigned release build artifact only
        uses: actions/upload-artifact@v4
        with:
          name: PGRP-v044-unsigned-release-for-permanent-signing
          path: PGRP_Android_v0.4.4_Unsigned_Release.apk
          if-no-files-found: error

      - name: Sign official release with permanent private keystore, when repository secrets are configured
        if: env.PGRP_KEYSTORE_B64 != '' && env.PGRP_STORE_PASS != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$PGRP_STORE_PASS"
          echo "::add-mask::$PGRP_KEYSTORE_B64"
          keystore="$RUNNER_TEMP/pgrp-android-release.p12"
          printf '%s' "$PGRP_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          export PGRP_SIGN_PASSWORD="$PGRP_STORE_PASS"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$keystore" --ks-key-alias pgrp_release \
            --ks-pass env:PGRP_SIGN_PASSWORD --key-pass env:PGRP_SIGN_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out PGRP_Android_v0.4.4_Permanent_Signed.apk \
            PGRP_Android_v0.4.4_Unsigned_Release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs PGRP_Android_v0.4.4_Permanent_Signed.apk
          keyfingerprint=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs PGRP_Android_v0.4.4_Permanent_Signed.apk | grep 'Signer #1 certificate SHA-256 digest:' | head -1 | awk '{print $NF}')
          echo "PGRP permanent certificate SHA256: $keyfingerprint"
          if [[ "$keyfingerprint" != "0880fb4c4f565950fef3f6334c5ebf85a649a1c0a20077df458515f6c09bf9c0" ]]; then
            echo "::error::Wrong PGRP release keystore. Refusing to publish an incompatible update."
            exit 1
          fi
          sha256sum PGRP_Android_v0.4.4_Permanent_Signed.apk
          rm -f "$keystore"

      - name: Upload signed APK
        if: env.PGRP_KEYSTORE_B64 != '' && env.PGRP_STORE_PASS != ''
        uses: actions/upload-artifact@v4
        with:
          name: PGRP-v044-PERMANENT-SIGNED
          path: PGRP_Android_v0.4.4_Permanent_Signed.apk
          if-no-files-found: error

      - name: Publish release only if permanent signing was configured and validated
        if: env.PGRP_KEYSTORE_B64 != '' && env.PGRP_STORE_PASS != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v0.4.4-android-dff-mesh-preview"
          sha="$(sha256sum PGRP_Android_v0.4.4_Permanent_Signed.apk | cut -d' ' -f1)"
          notes="PGRP Android v0.4.4 incremental permanently signed binary IPL update. Android package ir.paladinguard.gameclient, versionCode 8, PGRP permanent release key fingerprint 0880fb4c4f565950fef3f6334c5ebf85a649a1c0a20077df458515f6c09bf9c0. This update requires the same permanent PGRP release signature and can upgrade v0.4.2/v0.4.3 in place (versionCode 8). Older debug-signed v0.4.x are not upgrade compatible. From then on all APKs signed by the same release key can install in-place with an increasing versionCode. User-owned GTA data in shared Download folder remains intact. Hash SHA256: $sha"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" PGRP_Android_v0.4.4_Permanent_Signed.apk --clobber
          else
            gh release create "$tag" PGRP_Android_v0.4.4_Permanent_Signed.apk --target feature/pgrp-android-dff-real-mesh-v044 --title 'PGRP Android v0.4.4 - Original GTA DFF Mesh Preview' --notes "$notes" --prerelease
          fi
