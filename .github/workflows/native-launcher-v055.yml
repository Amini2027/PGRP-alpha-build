name: PGRP v0.5.5 Native Launcher
on:
  pull_request:
    paths:
      - 'launcher-native-v055/**'
      - '.github/workflows/native-launcher-v055.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  win64-native:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build native C++17 launcher x64 static runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S launcher-native-v055 -B build/native -G "Visual Studio 17 2022" -A x64
          if($LASTEXITCODE -ne 0){throw 'CMake configuration failed'}
          cmake --build build/native --config Release --parallel
          if($LASTEXITCODE -ne 0){throw 'Native x64 build failed'}
          $exe='build/native/Release/PGRPLauncher.exe'
          if(-not(Test-Path $exe)){throw 'No native launcher EXE'}
          Get-Item $exe | Select-Object FullName,Length | Format-List
          Get-FileHash $exe -Algorithm SHA256 | Format-List
      - name: Exercise actual launcher window and capture layout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path 'build/native/Release/PGRPLauncher.exe').Path
          $p=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 4
          if($p.HasExited){throw ('Native launcher exited prematurely, code '+$p.ExitCode)}
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $bounds=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp=[System.Drawing.Bitmap]::new($bounds.Width,$bounds.Height)
          $g=[System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          New-Item -ItemType Directory -Path 'build/ui' -Force | Out-Null
          $bmp.Save((Join-Path (Resolve-Path 'build/ui').Path 'native_055.png'),[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose();$bmp.Dispose()
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: PGRP-v0.5.5-Native-Launcher-x64
          path: build/native/Release/PGRPLauncher.exe
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PGRP-v0.5.5-Native-Launcher-Screenshot
          path: build/ui/native_055.png
          retention-days: 14
          if-no-files-found: error
