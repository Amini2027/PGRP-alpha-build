name: PGRP Android Launcher v0.1.0 APK

on:
  push:
    branches: [feature/pgrp-android-launcher-v010]
    paths:
      - 'android-launcher/**'
      - '.github/workflows/build-android-v010.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PGRP Android project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK on GitHub hosted runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and run UDP packet parser tests
        working-directory: android-launcher
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Confirm Android APK and size
        run: |
          set -euo pipefail
          src="android-launcher/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$src"
          cp "$src" PGRP_Android_v0.1.0_Alpha.apk
          sha256sum PGRP_Android_v0.1.0_Alpha.apk
          ls -lh PGRP_Android_v0.1.0_Alpha.apk

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PGRP-Android-v0.1.0-APK
          path: PGRP_Android_v0.1.0_Alpha.apk
          if-no-files-found: error

      - name: Publish directly installable APK release
        if: github.ref == 'refs/heads/feature/pgrp-android-launcher-v010'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v0.1.0-android-launcher-alpha"
          sha="$(sha256sum PGRP_Android_v0.1.0_Alpha.apk | cut -d' ' -f1)"
          notes="PGRP Android companion launcher alpha. Server status via SA-MP UDP query, Persian/English custom UI, nickname, copy IP, optional samp:// URI, safe install instructions. Debug-signed APK for initial Android 8+ testing. NOT a native GTA/SA-MP game client, and does not include GTA game assets. Mobile connectivity requires a separate compatible installed client and server support. SHA256: $sha"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" PGRP_Android_v0.1.0_Alpha.apk --clobber
          else
            gh release create "$tag" PGRP_Android_v0.1.0_Alpha.apk --target feature/pgrp-android-launcher-v010 --title 'PGRP Android Launcher v0.1.0 Alpha' --notes "$notes" --prerelease
          fi
