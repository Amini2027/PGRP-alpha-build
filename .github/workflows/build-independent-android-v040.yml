name: PGRP Independent Android Game Client 0.4.0

on:
  push:
    branches: [feature/pgrp-android-ipl-map-preview-v040]
    paths:
      - 'android-client/**'
      - '.github/workflows/build-independent-android-v040.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  independent-game-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout independent Android game code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use GitHub runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assert map preview sources are installed
        run: |
          grep -q 'openRealMapPreview()' android-client/app/src/main/java/ir/paladinguard/gameclient/GameActivity.java
          grep -q 'class GtaMapPlacementIndex' android-client/app/src/main/java/ir/paladinguard/gameclient/GtaMapPlacementIndex.java
          grep -q 'class GtaMapSafSource' android-client/app/src/main/java/ir/paladinguard/gameclient/GtaMapSafSource.java
          grep -q 'class GtaIplMapPreview' android-client/app/src/main/java/ir/paladinguard/gameclient/GtaIplMapPreview.java
          echo 'Map location preview wired to independent Android client'

      - name: Test independent movement and RakNet header, build game APK
        working-directory: android-client
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify PGRP independent APK
        run: |
          set -euo pipefail
          src="android-client/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$src"
          cp "$src" PGRP_Independent_Android_Client_v0.4.0_Alpha.apk
          unzip -l PGRP_Independent_Android_Client_v0.4.0_Alpha.apk | grep 'classes.dex'
          sha256sum PGRP_Independent_Android_Client_v0.4.0_Alpha.apk
          ls -lh PGRP_Independent_Android_Client_v0.4.0_Alpha.apk

      - name: Preserve independent client APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PGRP-Android-IPL-Placement-Preview-Alpha
          path: PGRP_Independent_Android_Client_v0.4.0_Alpha.apk
          if-no-files-found: error

      - name: Release alpha game-client APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v0.4.0-android-ipl-placement-preview"
          sha="$(sha256sum PGRP_Independent_Android_Client_v0.4.0_Alpha.apk | cut -d' ' -f1)"
          notes="PGRP independent Android alpha v0.4: read local user-selected GTA San Andreas gta.dat, text IDE and IPL map placement files via Android SAF, sample and show original Los Santos object XYZ positions in a scrollable/zoomable diagnostic point map. Existing v0.3 IMG VER2 validation, free-look 3D prototype and network probe preserved. IMPORTANT: no Rockstar geometry or textures rendered, binary IPL not supported, and no multiplayer login; game data is neither bundled nor uploaded. Debug-signed for testing. SHA256: $sha"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" PGRP_Independent_Android_Client_v0.4.0_Alpha.apk --clobber
          else
            gh release create "$tag" PGRP_Independent_Android_Client_v0.4.0_Alpha.apk --target feature/pgrp-android-ipl-map-preview-v040 --title 'PGRP Android v0.4 - GTA IPL/IDE Map Placement Preview' --notes "$notes" --prerelease
          fi
